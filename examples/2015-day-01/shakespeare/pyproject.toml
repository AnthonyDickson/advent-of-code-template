[project]
name = "aoc"
version = "0.1.0"
description = "Advent of Code solutions written in the Shakespeare Programming Language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["shakespearelang>=1,<2"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = [
  "A",  # flake8-builtins
  "B",  # flake8-bugbear
  "I",  # isort
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]
