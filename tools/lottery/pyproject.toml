[project]
name = "aoc-lottery"
version = "0.1.0"
description = "Weighted language lottery and template bootstrapper for Advent of Code"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "textual>=8",
]

[project.scripts]
aoc-lottery = "aoc_lottery.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoc_lottery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "I",   # isort
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]
