[[language]]
name = "fsharp"
# The local tools from .config/dotnet-tools.json are resolved from the
# workspace root, so give helix a marker to find it without a hardcoded path.
roots = [".config/dotnet-tools.json", "*.fsproj"]
language-servers = ["fsharp-ls"]

[language-server.fsharp-ls]
command = "dotnet"
args = ["fsautocomplete", "--adaptive-lsp-server-enabled"]

[language-server.fsharp-ls.config]
AutomaticWorkspaceInit = true

[[language]]
name = "markdown"
formatter = { command = "dprint", args = ["fmt", "--stdin", "md"]}
rulers = [120]

[[language]]
name = "scala"
# Helix does not know that a scala-cli project is marked by `project.scala` and
# already ships the build-tool markers below. Without the directive file it
# finds no root, falls back to the repository root, and lets metals leave
# `.bsp/`, `.metals/` and `.scala-build/` there.
roots = ["project.scala", "build.sbt", "build.sc", "build.gradle", "build.gradle.kts", "pom.xml", ".scala-build"]

[[language]]
name = "typescript"
# Helix defaults typescript to `typescript-language-server`, which the dev shell
# does not provide. Deno ships its own server, and `deno.json` marks the folder
# as a Deno project so the server resolves imports from the right root.
roots = ["deno.json", "deno.jsonc"]
language-servers = ["deno-lsp"]

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]

[[language]]
name = "typst"
# Helix has no root marker for typst, so it falls back to the repository root
# and tinymist resolves the `/src/...` imports of a template, example or
# bootstrapped day against that instead of against the folder they live in.
# Each of those folders carries its own `main.typ`, which marks it as the root.
roots = ["main.typ"]
